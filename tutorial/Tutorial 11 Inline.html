<!DOCTYPE html>
<html>
<head>
<title>Tutorial 11 Inline CSS</title>
<link rel=icon href=bird.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
</head>
<!--1.background-image, 2.line-height, 3.letter-spacing-->
<body style="background-image:url(Foodbowl.png);background-repeat: repeat-x;line-height:1.6;letter-spacing:1px;font-size:200%;"><h1 style="color:purple;padding:15px;background:blue;width:fit-content;font-family:cursive;font-size:300%;text-transform:lowercase;">CSS</h1>
<!--4.text-transform, 5.margin-left, 6.word-spacing-->
<p style="margin-left:15px;word-spacing:4px;">
<!--7.text-decoration-->
<font style="font-weight: bold;text-decoration:underline;">CSS(Cascading Style Sheets)</font> was developed by
<font style="font-size:35px;">W3C(World Wide Web Consortium) </font>in 1996.
</p>
<!--8.border-style, 9.padding-bottom-->
<p style="border-style:dashed;padding-bottom:12px;">
It allows you to create great-looking web pages.
</p>
<!--10.opacity-->
<p style="opacity:0.9;margin-bottom:25px;">
CSS is used along with HTML and JavaScript in most websites
to create user interfaces for web applications and user interfaces for many mobile applications.
</p>
</body></html>

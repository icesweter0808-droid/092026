<!DOCTYPE html>
<html>
<head>
<title>Tutorial 11 Internal CSS</title>
<link rel=icon href=bird.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
<style>
body {
/*1.background-image*/
background-image:url(Foodbowl.png);
background-repeat:repeat-x;
/*2.line-height*/
line-height:1.6;
/*3.letter-spacing*/
letter-spacing:1px;
font-size:200%;
}
h1 {
color:purple;
padding:15px;
background:blue;
width:fit-content;
font-family:cursive;
font-size:300%;
/*4.text-transform*/
text-transform:lowercase;
}
.p1 {
/*5.margin-left*/
margin-left:15px;
/*6.word-spacing*/
word-spacing:4px;
}
.font-style {
font-weight:bold;
/*7.text-decoration*/
text-decoration:underline;
}
.p2 {
/*8.border-style*/
border-style:dashed;
/*9.padding-bottom*/
padding-bottom:12px;
}
.p3 {
/*10.opacity*/
opacity:0.9;
margin-bottom:25px;
}
</style>
</head>
<body><h1>CSS</h1>
<p class="p1">
<font class="font-style">CSS(Cascading Style Sheets)</font> was developed by
<font style="font-size:35px;">W3C(World Wide Web Consortium) </font>in 1996.
</p>
<p class="p2">
It allows you to create great-looking web pages.
</p>
<p class="p3">
CSS is used along with HTML and JavaScript in most websites
to createe user interfaces for web applications and user interfaces for many mobile applications.
</p>
</body></html>

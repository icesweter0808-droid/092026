<h2 class="section-title">Our Culinary Story</h2>
<p class="about-text">Founded in 2026, Ben-to Box partners with local farms and master bakers to bring pre-portioned gourmet meal kits and fresh pastries straight to your doorstep.</p>

<h3 class="form-heading">Send Us an Inquiry</h3>
<form onsubmit="submitInquiry(event)">
<div class="form-group">
<label for="name">Full Name</label>
<input type="text" id="name" required>
</div>
<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" required>
</div>
<div class="form-group">
<label for="message">Message / Dietary Requests</label>
<textarea id="message" rows="5" required></textarea>
</div>
<button type="submit" class="btn">Send Message</button>
</form>

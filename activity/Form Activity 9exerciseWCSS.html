<!DOCTYPE html>
<html>
<head>
<title>Form - Text Input</title>
<link rel="icon" href="bird.jpg" type="image/jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
.form-table {
border-collapse: separate;
border-spacing: 0 3px;
width: 100%;
}
.form-table tr td:first-child {
background-color: gray;
color: white;
font-weight: bold;
padding: 12px 10px;
width: 32%;
text-align: left;
}
.form-table tr td:last-child {
padding-left: 15px;
vertical-align: middle;
color: #696969;
}
</style>
</head>
<body topmargin="50">
<center>
<div style="background-color:powderblue; font-family:verdana; width:60%; padding:20px; box-sizing:border-box;">
<p style="color:#696969; font-size:160%; text-align:center; margin-top:0; font-weight: bold;">Personal details:</p>
<form>
<table border="0" cellpadding="0" cellspacing="0" class="form-table">
<tr>
<td>First Name:</td>
<td><input type="text" name="fname" style="width: 200px;"></td>
</tr>
<tr>
<td>Last Name:</td>
<td><input type="text" name="lname" style="width: 200px;"></td>
</tr>
<tr>
<td>Gender:</td>
<td>
<input type="radio" name="gender" value="Male"> Male 
<input type="radio" name="gender" value="Female"> Female
</td>
</tr>
<tr>
<td>Favourite subjects:</td>
<td>
<input type="checkbox" name="fav_sub" value="DCS4103"> DCS4103 
<input type="checkbox" name="fav_sub" value="DCS3003"> DCS3003 
<input type="checkbox" name="fav_sub" value="MST1003"> MST1003 
<input type="checkbox" name="fav_sub" value="MST2003"> MST2003
</td>
</tr>
<tr>
<td style="vertical-align: top;">Address:</td>
<td><textarea rows="4" cols="30" name="address"></textarea></td>
</tr>
<tr>
<td>Date of Birth:</td>
<td><input type="date" name="dob"></td>
</tr>
<tr>
<td>Login password:</td>
<td><input type="password" name="loginpass" style="width: 200px;"></td>
</tr>
<tr>
<td>Course:</td>
<td>
<select name="course">
<option value="0">- List of Courses -</option>
<optgroup label="Diploma In Computer Science">
<option value="DCS_S1">Semester 1</option>
<option value="DCS_S2">Semester 2</option>
<option value="DCS_S3">Semester 3</option>
<option value="DCS_S4">Semester 4</option>
<option value="DCS_S5">Semester 5</option>
<option value="DCS_S6">Semester 6</option>
</optgroup>
<option value="DIB" selected>Diploma in Business</option>
<option value="DAS">Diploma In Airline Services</option>
</select>
</td>
</tr>
<tr>
<td style="background: transparent;"></td>
<td style="padding-top: 15px;">
<input type="submit" value="Submit"> 
<input type="reset" value="Reset">
</td> </tr>
</table>
</form></div>
</center></body></html>

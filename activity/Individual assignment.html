<!DOCTYPE html>
<html>
<head>
<title>Login Page</title>
<style>
body {
background-color: oldlace;
font-family: Arial;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
.login-box {
background-color: white;
padding: 30px;
width: 350px;
border-style: solid;
border-width: 1px;
border-color: tan;
border-radius: 8px;
}
h2 {
text-align: center;
color: black;
margin-bottom: 20px;
}
.form-group {
margin-bottom: 15px;
}
label {
display: block;
margin-bottom: 5px;
font-weight: bold;
}
input {
width: 100%;
padding: 10px;
box-sizing: border-box;
border-style: solid;
border-width: 1px;
border-color: tan;
border-radius: 4px;
}
input:focus {
border-color: brown;
outline: none;
}
button {
width: 100%;
padding: 12px;
background-color: tan;
color: black;
border-style: solid;
border-width: 1px;
border-color: brown;
border-radius: 4px;
font-weight: bold;
cursor: pointer;
}
button:hover {
background-color: brown;
color: white;
}
.error {
color: red;
font-size: 13px;
margin-top: 5px;
display: none;
}
</style>
</head>
<body>
<div class='login-box'>
<h2>Login</h2>
<form id='loginForm'>
<div class='form-group'>
<label>Username</label>
<input type='text' id='username' placeholder='Enter Username'>
<div id='userError' class='error'>Username cannot be empty</div>
</div>
<div class='form-group'>
<label>Password</label>
<input type='password' id='password' placeholder='Enter Password'>
<div id='passError' class='error'>Password must be at least 6 characters</div>
</div>
<button type='submit'>Login</button>
</form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(event) {
event.preventDefault();
var user = document.getElementById('username').value;
var pass = document.getElementById('password').value;
var userErr = document.getElementById('userError');
var passErr = document.getElementById('passError');
var isValid = true;
if (user.trim() === '') {
userErr.style.display = 'block';
isValid = false;
} else {
userErr.style.display = 'none';
}
if (pass.trim() === '') {
passErr.innerText = 'Password cannot be empty';
passErr.style.display = 'block';
isValid = false;
} else if (pass.length < 6) {
passErr.innerText = 'Password must be at least 6 characters';
passErr.style.display = 'block';
isValid = false;
} else {
passErr.style.display = 'none';
}
if (isValid === true) {
alert('Login Successful!');
}
});
</script>
</body>
</html>

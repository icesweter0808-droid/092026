<!DOCTYPE html>
<html>
<head>
<title>Heading Quiz CSS</title>
<link rel=icon href=bird.jpg type=image/jpg>
<meta name=viewport content=width=device-width,initial-scale=1.0>
<link rel=stylesheet href="Individual assignment.css">
</head>
<body>
<div class='login-box'>
<h2>Login</h2>
<form id='loginForm'>
<div class='form-group'>
<label>Username</label>
<input type='text' id='username' placeholder='Enter Username'>
<div id='userError' class='error'>Username cannot be empty</div>
</div>
<div class='form-group'>
<label>Password</label>
<input type='password' id='password' placeholder='Enter Password'>
<div id='passError' class='error'>Password must be at least 6 characters</div>
</div>
<button type='submit'>Login</button>
</form>
</div>
<script src="Individual_assignment.js"></script>
</body>
</html>

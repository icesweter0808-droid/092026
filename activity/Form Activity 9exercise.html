<!DOCTYPE html>
<html>
<head>
<title>Form - Text Input</title>
<link rel="icon" href="bird.jpg" type="image/jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body topmargin="50">
<center>
<div style="background-color:powderblue; font-family:verdana; width:60%; padding:20px; box-sizing:border-box;">
<p style="color:#696969; font-size:160%; text-align:center; margin-top:0;">Personal details:</p>
<form>
<table border="0" cellpadding="5" cellspacing="0" style="color:#696969; font-size:100%; width:100%;">
<tr>
<td style="text-align:left; font-weight:bold; vertical-align:middle; width:30%;">First Name</td>
<td style="text-align:middle;"><input type="text" name="fname"></td>
</tr>
<tr>
<td style="text-align:left; font-weight:bold; vertical-align:middle;">Last Name</td>
<td style="text-align:middle;"><input type="text" name="lname"></td>
</tr>
<tr>
<td style="text-align:left; vertical-align:middle;">Gender:</td>
<td style="text-align:middle;">
<input type="radio" name="gender" value="Male"> Male 
<input type="radio" name="gender" value="Female"> Female
</td>
</tr>
<tr>
<td style="text-align:left; vertical-align:middle;">Choose your favorite subjects:</td>
<td style="text-align:middle;">
<input type="checkbox" name="fav_sub" value="DCS4103">DCS4103 
<input type="checkbox" name="fav_sub" value="DCS3003">DCS3003 
<input type="checkbox" name="fav_sub" value="MST1003">MST1003 
<input type="checkbox" name="fav_sub" value="MST2003">MST2003
</td></tr>
<tr>
<td style="text-align:left; font-weight:bold; vertical-align:top;">Address:</td>
<td style="text-align:middle;"><textarea rows="4" cols="30" name="address"></textarea></td>
</tr>
<tr>
<td style="text-align:left; font-weight:bold; vertical-align:middle;">Date of birth:</td>
<td style="text-align:middle;"><input type="date" name="dob"></td>
</tr>
<tr>
<td style="text-align:left; font-weight:bold; vertical-align:middle;">Login password:</td>
<td style="text-align:middle;"><input type="password" name="loginpass"></td>
</tr>
<tr>
<td style="text-align:left;vertical-align:middle;">Course:</td>
<td style="text-align:middle;">
<select name="course">
<option value="0">- List of Courses -</option>
<optgroup label="Diploma In Computer Science">
<option value="DCS_S1">Semester 1</option>
<option value="DCS_S2">Semester 2</option>
<option value="DCS_S3">Semester 3</option>
<option value="DCS_S4">Semester 4</option>
<option value="DCS_S5">Semester 5</option>
<option value="DCS_S6">Semester 6</option>
</optgroup>
<option value="DIB" selected>Diploma in Business</option>
<option value="DAS">Diploma In Airline Services</option>
</select>
</td></tr>
<tr><td></td>
<td align=left>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</td>
</table></form>
</div>
</center></body></html>
